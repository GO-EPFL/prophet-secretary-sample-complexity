name: Lean

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build with the pinned toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "true"
          use-github-cache: "false"
          use-mathlib-cache: "true"
      - name: Check public imports and axioms
        run: lake env lean --run scripts/CheckAxioms.lean
